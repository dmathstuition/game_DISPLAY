<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IJA Maths Quiz — Live Screen</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060b14;--card:#0c1422;--border:#152035;
  --gold:#f59e0b;--text:#f0f6ff;--text2:#4a6080;
  --green:#10b981;--red:#ef4444;--accent:#2563eb;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow:hidden}

/* Starfield BG */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.8)}50%{opacity:.6;transform:scale(1.1)}}

.screen{display:none;position:relative;z-index:1;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.screen.active{display:flex}

/* ─ Setup ─ */
#s-setup{text-align:center}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px;width:100%;max-width:480px;text-align:left}
.setup-card h1{color:var(--gold);font-size:1.4rem;margin-bottom:4px;text-align:center}
.setup-card .sub{color:var(--text2);font-size:0.85rem;text-align:center;margin-bottom:24px}
label{display:block;font-size:0.72rem;color:var(--text2);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace}
.fg{margin-bottom:12px}
input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;transition:border .15s}
input:focus{border-color:var(--gold)}
button{padding:13px 24px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:0.95rem;font-weight:700;transition:all .15s}
.btn-gold{background:var(--gold);color:#060b14;width:100%}.btn-gold:hover{background:#d97706}
.cfg-msg{font-size:0.82rem;margin-top:12px;padding:8px 12px;border-radius:8px;display:none}
.cfg-ok{background:rgba(16,185,129,.1);border:1px solid var(--green);color:var(--green)}
.cfg-err{background:rgba(239,68,68,.1);border:1px solid var(--red);color:var(--red)}

/* ─ Lobby ─ */
#s-lobby{text-align:center;gap:20px}
.ija-logo{font-size:5rem;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.big-title{font-size:3.5rem;font-weight:900;color:var(--gold);line-height:1.1;text-shadow:0 0 60px rgba(245,158,11,.4)}
.sub-title{font-size:1.2rem;color:var(--text2)}
.player-pill{background:var(--card);border:1px solid var(--border);border-radius:30px;padding:10px 28px;font-size:1rem;color:var(--gold);font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:8px}
.pulse-ring{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:ring-pulse 2s infinite;display:inline-block;margin-right:8px}
@keyframes ring-pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 12px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

/* ─ Question ─ */
#s-question{padding:32px 48px;gap:0;justify-content:flex-start}
.q-top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.q-counter{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--text2);font-weight:700}
.timer-circle{position:relative;width:80px;height:80px;flex-shrink:0}
.timer-circle svg{transform:rotate(-90deg)}
.timer-circle .bg-ring{fill:none;stroke:var(--border);stroke-width:6}
.timer-circle .prog-ring{fill:none;stroke:var(--gold);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.timer-circle .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:800;color:var(--gold)}
.q-body{width:100%;display:flex;flex-direction:column;flex:1}
.q-text-big{font-size:2rem;font-weight:800;line-height:1.3;margin-bottom:32px;text-align:center;padding:0 40px;color:var(--text)}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:1000px;margin:0 auto}
.opt-card{
  border-radius:20px;padding:24px 28px;
  display:flex;align-items:center;gap:16px;
  font-size:1.3rem;font-weight:700;
  border:3px solid transparent;
  animation:fadeUp .35s ease both;
}
.opt-card:nth-child(1){animation-delay:.05s;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.opt-card:nth-child(2){animation-delay:.1s;background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)}
.opt-card:nth-child(3){animation-delay:.15s;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}
.opt-card:nth-child(4){animation-delay:.2s;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.opt-letter{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:900;flex-shrink:0}
.opt-card:nth-child(1) .opt-letter{background:rgba(239,68,68,.25);color:#ef4444}
.opt-card:nth-child(2) .opt-letter{background:rgba(59,130,246,.25);color:#60a5fa}
.opt-card:nth-child(3) .opt-letter{background:rgba(245,158,11,.25);color:#f59e0b}
.opt-card:nth-child(4) .opt-letter{background:rgba(16,185,129,.25);color:#10b981}
.opt-card-text{flex:1}

/* Reveal state */
.opt-card.correct{border-color:var(--green);background:rgba(16,185,129,.2)}
.opt-card.wrong{opacity:.35}
.opt-card.correct .opt-letter{background:var(--green);color:#060b14}

/* Stats bars below options */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:1000px;margin:16px auto 0}
.stat-bar-wrap{padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:10px}
.stat-label{font-size:0.85rem;font-weight:700;width:16px;flex-shrink:0}
.bar-bg{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .5s ease}
.stat-count{font-size:0.85rem;font-family:'JetBrains Mono',monospace;color:var(--text2);min-width:24px;text-align:right}
.bar-A .bar-fill{background:#ef4444}.bar-B .bar-fill{background:#3b82f6}.bar-C .bar-fill{background:#f59e0b}.bar-D .bar-fill{background:#10b981}

/* ─ Leaderboard ─ */
#s-leaderboard{gap:0;padding:32px 48px;justify-content:flex-start}
.lb-header{text-align:center;margin-bottom:24px;width:100%}
.lb-header h1{font-size:2.5rem;font-weight:900;color:var(--gold)}
.lb-grid{width:100%;max-width:800px;margin:0 auto}
.lb-item{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:10px;animation:slideIn .4s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.lb-rank-big{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:900;width:48px;text-align:center;flex-shrink:0;color:var(--text2)}
.lb-item:nth-child(1){background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4)}.lb-item:nth-child(1) .lb-rank-big{color:var(--gold);font-size:1.8rem}
.lb-item:nth-child(2){border-color:rgba(148,163,184,.3)}.lb-item:nth-child(2) .lb-rank-big{color:#94a3b8}
.lb-item:nth-child(3){border-color:rgba(205,127,50,.3)}.lb-item:nth-child(3) .lb-rank-big{color:#cd7f32}
.lb-name{flex:1;font-size:1.2rem;font-weight:700}
.lb-score-big{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:800;color:var(--gold)}

/* ─ Ended ─ */
#s-ended{text-align:center;gap:16px}
.trophy-big{font-size:8rem;animation:popBounce 1s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes popBounce{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* ─ Answer countdown overlay ─ */
#answer-count{position:fixed;bottom:24px;right:24px;z-index:10;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 20px;font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--text2);display:none}
#answer-count .num{color:var(--green);font-weight:800;font-size:1.1rem}
</style>
</head>
<body>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- SETUP -->
<div class="screen active" id="s-setup">
  <div class="setup-card">
    <div style="font-size:2.5rem;text-align:center;margin-bottom:10px">📺</div>
    <h1>Audience Screen Setup</h1>
    <p class="sub">Connect to Firebase once, then this becomes your live display.</p>
    <div class="fg"><label>API Key</label><input id="cfg-key" placeholder="AIzaSy..."/></div>
    <div class="fg"><label>Database URL</label><input id="cfg-db" placeholder="https://your-project-default-rtdb.firebaseio.com"/></div>
    <div class="fg"><label>Project ID</label><input id="cfg-pid" placeholder="your-project-id"/></div>
    <div class="fg"><label>Auth Domain</label><input id="cfg-auth" placeholder="your-project.firebaseapp.com"/></div>
    <button class="btn-gold" onclick="connectAndLaunch()">Connect & Launch</button>
    <div id="cfg-msg" class="cfg-msg"></div>
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="s-lobby">
  <div class="ija-logo">🧮</div>
  <div class="big-title">IJA Maths Quiz</div>
  <div class="sub-title">Infant Jesus Academy</div>
  <div class="player-pill"><span class="pulse-ring"></span><span id="lobby-count">0</span> players joined</div>
</div>

<!-- QUESTION -->
<div class="screen" id="s-question">
  <div class="q-top">
    <div class="q-counter" id="q-counter">Q1 of 1</div>
    <div class="timer-circle">
      <svg viewBox="0 0 80 80" width="80" height="80">
        <circle class="bg-ring" cx="40" cy="40" r="34"/>
        <circle class="prog-ring" id="prog-ring" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="0"/>
      </svg>
      <div class="num" id="timer-num">30</div>
    </div>
  </div>
  <div class="q-body">
    <div class="q-text-big" id="q-text-big"></div>
    <div class="opts-grid" id="opts-grid"></div>
    <div class="stats-row" id="stats-row" style="display:none"></div>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="screen" id="s-leaderboard">
  <div class="lb-header"><div style="font-size:2.5rem">🏆</div><h1>Leaderboard</h1></div>
  <div class="lb-grid" id="lb-grid"></div>
</div>

<!-- ENDED -->
<div class="screen" id="s-ended">
  <div class="trophy-big">🏆</div>
  <div style="font-size:2.5rem;font-weight:900;color:var(--gold)">Competition Complete!</div>
  <div style="font-size:1.1rem;color:var(--text2);margin-top:8px">Congratulations to all participants</div>
  <div class="lb-grid" id="ended-lb" style="margin-top:24px;width:100%;max-width:600px"></div>
</div>

<!-- Answer counter overlay -->
<div id="answer-count">Answered: <span class="num" id="ans-num">0</span>/<span id="ans-total">0</span></div>

<script>
let db = null, timerInt = null, gs = {};
const CIRCUMF = 213.6;
const OPT_COLORS = {A:'#ef4444',B:'#3b82f6',C:'#f59e0b',D:'#10b981'};

/* ─ Stars ─ */
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${.1+Math.random()*.3}`;
    c.appendChild(s);
  }
})();

/* ─ Screens ─ */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');s.style.display='none';});
  const el=document.getElementById(id);if(el){el.style.display='flex';el.classList.add('active');}
}

/* ─ Setup ─ */
function getCfg(){return JSON.parse(localStorage.getItem('ija_cfg')||'null');}
function loadCfgInputs(){const c=getCfg();if(!c)return;sv('cfg-key',c.apiKey||'');sv('cfg-db',c.databaseURL||'');sv('cfg-pid',c.projectId||'');sv('cfg-auth',c.authDomain||'');}
function connectAndLaunch(){
  const c={apiKey:gv('cfg-key'),databaseURL:gv('cfg-db'),projectId:gv('cfg-pid'),authDomain:gv('cfg-auth')};
  if(!c.apiKey||!c.databaseURL){cfgMsg('Enter API Key and Database URL','e');return;}
  localStorage.setItem('ija_cfg',JSON.stringify(c));initFB(c);
}
function cfgMsg(msg,t){const el=document.getElementById('cfg-msg');el.style.display='block';el.className='cfg-msg '+(t==='s'?'cfg-ok':'cfg-err');el.textContent=msg;}
function initFB(cfg){
  try{if(firebase.apps.length>0)firebase.app().delete().then(()=>startFB(cfg));else startFB(cfg);}catch(e){startFB(cfg);}
}
function startFB(cfg){
  try{
    firebase.initializeApp(cfg);db=firebase.database();
    cfgMsg('✓ Connected — loading...','s');
    setTimeout(()=>setupListeners(),600);
  }catch(e){cfgMsg('Error: '+e.message,'e');}
}

/* ─ Listeners ─ */
function setupListeners(){
  db.ref('quiz/state').on('value',s=>handleState(s.val()||'lobby'));
  db.ref('quiz/currentQuestion').on('value',s=>{gs.cq=s.val();if(gs.state==='question_active')renderQuestion();if(gs.state==='reveal')renderReveal();});
  db.ref('quiz/currentQIndex').on('value',s=>gs.qIndex=s.val()??-1);
  db.ref('quiz/questions').on('value',s=>{gs.qs=s.val()||[];});
  db.ref('quiz/players').on('value',s=>{
    gs.players=s.val()||{};
    const cnt=Object.keys(gs.players).length;
    document.getElementById('lobby-count').textContent=cnt;
    const ans=Object.values(gs.players).filter(p=>p.answered).length;
    document.getElementById('ans-num').textContent=ans;
    document.getElementById('ans-total').textContent=cnt;
    if(gs.state==='leaderboard')renderLB('lb-grid');
    if(gs.state==='ended')renderLB('ended-lb');
    if(gs.state==='question_active'||gs.state==='reveal')renderStatBars();
  });
}
function handleState(state){
  gs.state=state;
  document.getElementById('answer-count').style.display=state==='question_active'?'block':'none';
  if(state==='lobby'){clearTimer();show('s-lobby');}
  else if(state==='question_active'){renderQuestion();show('s-question');}
  else if(state==='reveal'){clearTimer();renderReveal();show('s-question');}
  else if(state==='leaderboard'){clearTimer();renderLB('lb-grid');show('s-leaderboard');}
  else if(state==='ended'){clearTimer();renderLB('ended-lb');show('s-ended');}
}

/* ─ Question ─ */
function renderQuestion(){
  if(!gs.cq)return;
  const q=gs.cq, total=gs.qs?.length||'?';
  document.getElementById('q-counter').textContent='Q'+(q.index+1)+' of '+total;
  document.getElementById('q-text-big').textContent=q.text;
  document.getElementById('stats-row').style.display='none';
  const grid=document.getElementById('opts-grid');
  grid.innerHTML=['A','B','C','D'].map((o,i)=>`
    <div class="opt-card" id="oc-${o}">
      <div class="opt-letter">${o}</div>
      <div class="opt-card-text">${q.options[o]}</div>
    </div>`).join('');
  startTimer(q.timeLimit,q.startTime);
}
function startTimer(limit,startTime){
  clearTimer();
  const ring=document.getElementById('prog-ring');
  function tick(){
    const elapsed=(Date.now()-startTime)/1000;
    const left=Math.max(0,limit-elapsed);
    const pct=left/limit;
    ring.style.strokeDashoffset=(1-pct)*CIRCUMF;
    ring.style.stroke=left<=10?'#ef4444':'#f59e0b';
    const numEl=document.getElementById('timer-num');
    numEl.textContent=Math.ceil(left);
    numEl.style.color=left<=10?'#ef4444':'#f59e0b';
    if(left<=0)clearTimer();
  }
  tick();timerInt=setInterval(tick,250);
}
function clearTimer(){clearInterval(timerInt);timerInt=null;}

/* ─ Reveal ─ */
function renderReveal(){
  if(!gs.cq||!gs.cq.answer)return;
  const correct=gs.cq.answer;
  ['A','B','C','D'].forEach(o=>{
    const el=document.getElementById('oc-'+o);if(!el)return;
    el.classList.remove('correct','wrong');
    el.classList.add(o===correct?'correct':'wrong');
  });
  renderStatBars();
  document.getElementById('stats-row').style.display='grid';
}

/* ─ Stat Bars ─ */
function renderStatBars(){
  const counts={A:0,B:0,C:0,D:0};
  Object.values(gs.players||{}).forEach(p=>{if(p.lastAnswer&&counts[p.lastAnswer]!==undefined)counts[p.lastAnswer]++;});
  const total=Object.values(counts).reduce((a,b)=>a+b,0)||1;
  const row=document.getElementById('stats-row');
  row.innerHTML=['A','B','C','D'].map(o=>`
    <div class="stat-bar-wrap bar-${o}">
      <span class="stat-label" style="color:${OPT_COLORS[o]}">${o}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(counts[o]/total*100)}%"></div></div>
      <span class="stat-count">${counts[o]}</span>
    </div>`).join('');
}

/* ─ Leaderboard ─ */
function renderLB(containerId){
  const sorted=Object.values(gs.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));
  const medals=['🥇','🥈','🥉'];
  const top=containerId==='ended-lb'?sorted.slice(0,5):sorted.slice(0,8);
  document.getElementById(containerId).innerHTML=top.map((p,i)=>`
    <div class="lb-item" style="animation-delay:${i*0.08}s">
      <div class="lb-rank-big">${medals[i]||i+1}</div>
      <div class="lb-name">${p.name||'?'}</div>
      <div class="lb-score-big">${p.score||0}</div>
    </div>`).join('');
}

/* ─ Init ─ */
(function(){
  loadCfgInputs();
  const c=getCfg();
  if(c){cfgMsg('Reconnecting...','s');initFB(c);}
  else{show('s-setup');}
})();

function gv(id){return document.getElementById(id)?.value?.trim()||'';}
function sv(id,val){const el=document.getElementById(id);if(el)el.value=val;}
</script>
</body>
</html>
